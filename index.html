}

function renderGuides() {
  const post = POSTS[state.lang].find((item) => item[0] === state.slug);
  if (post) {
    return `<article class="block"><div class="wrap prose">
      <p class="tag">${esc(post[2])} · 29/10/2026 · ${esc(t("draft"))}</p>
      <h1 style="margin-top:12px">${esc(post[3])}</h1>
      <p class="lead">${esc(post[4])}</p>
      ${post[5].map((para) => `<p>${esc(para)}</p>`).join("")}
      <p style="margin-top:28px"><a class="link" href="#/guias">${esc(t("back"))}</a></p>
      <div style="margin-top:28px">${storeBtns(false)}</div>
    </div></article>`;
  }
  const labels = { edu: POSTS[state.lang].find((p) => p[1] === "edu")[2], fraud: POSTS[state.lang].find((p) => p[1] === "fraud")[2], life: POSTS[state.lang].find((p) => p[1] === "life")[2], product: POSTS[state.lang].find((p) => p[1] === "product")[2] };
  const filters = PFILTERS.map(([id]) => `<button type="button" class="chip" data-post="${id}" aria-pressed="${state.post === id}" id="pf-${id}">${esc(id === "all" ? t("faqAll") : labels[id])}</button>`).join("");
  const list = POSTS[state.lang].filter((p) => state.post === "all" || p[1] === state.post);
  return `<article class="block"><div class="wrap">
    ${eye(t("postEye"))}<h1>${esc(t("guideH"))}</h1><p class="lead">${esc(t("guideL"))}</p>
    <div class="filters" role="group" aria-label="${esc(t("postEye"))}">${filters}</div>
    <div style="margin-top:12px">${list.map((p) => `<a class="post-row" href="#/guias/${p[0]}"><span class="tag">${esc(p[2])} · 29/10/2026 · ${esc(t("draft"))}</span><span><h3>${esc(p[3])}</h3><p class="lead">${esc(p[4])}</p></span><span class="link">${esc(t("read"))}</span></a>`).join("")}</div>
  </div></article>`;
}

function renderLegal() {
  const docs = LEGAL[state.lang];
  const current = docs.find((d) => d[0] === state.slug) || docs[0];
  return `<article class="block"><div class="wrap legal-grid">
    <nav class="side" aria-label="${esc(t("legalEye"))}">
      ${eye(t("legalEye"))}
      ${docs.map(([slug, title]) => `<a href="#/legal/${slug}"${current[0] === slug ? ` aria-current="page"` : ""}>${esc(title)}</a>`).join("")}
    </nav>
    <div class="prose">
      <h1>${esc(current[1])}</h1>
      <p class="lead">${esc(t("work"))}</p>
      ${current[2].map((para) => `<p>${esc(para)}</p>`).join("")}
    </div>
  </div></article>`;
}

function renderMain() {
  const map = { inicio: renderHome, costos: renderCost, seguridad: renderSafe, ayuda: renderHelp, guias: renderGuides, legal: renderLegal };
  document.getElementById("main").innerHTML = map[state.page]();
  const titles = { inicio: "titleHome", costos: "titleCost", seguridad: "titleSafe", ayuda: "titleHelp", guias: "titleGuides", legal: "titleLegal" };
  document.title = t(titles[state.page]);
  document.documentElement.lang = state.lang === "en" ? "en" : "es";
  document.getElementById("skip").textContent = t("skip");
}

function readHash() {
  const parts = (location.hash || "#/inicio").replace(/^#\/?/, "").split("/").filter(Boolean);
  const page = PAGES.includes(parts[0]) ? parts[0] : "inicio";
  let slug = parts[1] || "";
  if (page === "legal" && !LEGAL.es.some((d) => d[0] === slug)) slug = "terminos";
  if (page === "guias" && slug && !POSTS.es.some((d) => d[0] === slug)) slug = "";
  if (page !== "legal" && page !== "guias") slug = "";
  state.page = page;
  state.slug = slug;
}

function render(opts = {}) {
  const focusId = opts.focusId || "";
  renderHeader();
  renderBar();
  renderMain();
  renderFooter();
  document.body.classList.toggle("menu-open", state.menu);
  if (opts.anchor) {
    const node = document.getElementById(opts.anchor);
    if (node) node.scrollIntoView();
  } else if (opts.scroll !== false) {
    window.scrollTo(0, 0);
  }
  if (focusId) {
    const node = document.getElementById(focusId);
    if (node) node.focus();
  }
}

document.addEventListener("click", (e) => {
  const lang = e.target.closest("#lang-es, #lang-en");
  if (lang) {
    state.lang = lang.id === "lang-en" ? "en" : "es";
    localStorage.setItem("neto-lang", state.lang);
    render({ scroll: false, focusId: lang.id });
    return;
  }
  if (e.target.closest("#menuBtn")) {
    state.menu = !state.menu;
    render({ scroll: false, focusId: state.menu ? "nav-inicio" : "menuBtn" });
    return;
  }
  if (e.target.closest("#closeBar")) {
    state.bar = false;
    sessionStorage.setItem("neto-bar", "off");
    render({ scroll: false });
    return;
  }
  const faq = e.target.closest("[data-faq]");
  if (faq) {
    state.faq = faq.getAttribute("data-faq");
    state.open = "";
    render({ scroll: false, focusId: faq.id });
    return;
  }
  const post = e.target.closest("[data-post]");
  if (post) {
    state.post = post.getAttribute("data-post");
    render({ scroll: false, focusId: post.id });
    return;
  }
  const acc = e.target.closest(".acc-btn");
  if (acc) {
    const id = acc.id.replace("faq-", "");
    state.open = state.open === id ? "" : id;
    render({ scroll: false, focusId: acc.id });
    return;
  }
  const a = e.target.closest("a[href^='#/']");
  if (!a) return;
  state.anchor = a.dataset.anchor || "";
  state.menu = false;
  if (a.getAttribute("href") === location.hash) {
    e.preventDefault();
    readHash();
    render({ scroll: !state.anchor, anchor: state.anchor });
    state.anchor = "";
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.menu) {
    state.menu = false;
    render({ scroll: false, focusId: "menuBtn" });
  }
});

window.addEventListener("hashchange", () => {
  readHash();
  const anchor = state.anchor;
  state.anchor = "";
  render({ scroll: !anchor, anchor });
});

readHash();
render({ scroll: true });
</script>
</body>
</html>
